services:
  - type: worker
    name: arab-city-justice-test-bot
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install --prefix bot
    startCommand: node bot/index.js
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: BOT_INGEST_SECRET
        sync: false
      - key: WORKER_INGEST_URL
        value: https://arab-city-justice.mohamed2y2y2g.workers.dev/api/bot/messages
